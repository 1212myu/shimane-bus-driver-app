<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>島根コミュニティバス 運行支援</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 便選択画面 -->
  <div id="screen-select" class="screen active">
    <header class="header">
      <h1>島根コミュニティバス</h1>
      <p class="subtitle">運行支援システム</p>
    </header>
    <div class="date-info">
      <p id="today-date"></p>
      <p id="service-type"></p>
    </div>
    <div id="suspension-notice" class="notice hidden">
      <p>本日は全便運休です</p>
    </div>
    <div id="trip-list"></div>
    <div class="fare-counter-entry">
      <button id="btn-open-fare" class="btn-fare-open">計算カウンター</button>
    </div>
  </div>

  <!-- 計算カウンター画面 -->
  <div id="screen-fare" class="screen">
    <header class="header-driving">
      <span id="fare-trip-label">計算</span>
      <button id="btn-fare-back" class="btn-back">← 戻る</button>
    </header>

    <div class="fare-cash-hero">
      <div class="fare-cash-hero-label">現金合計</div>
      <div id="fare-cash-total" class="fare-cash-hero-amount">0円</div>
    </div>

    <!-- 便タブ -->
    <div id="fare-trip-tabs" class="fare-trip-tabs"></div>

    <!-- 現金運賃タリー -->
    <div class="tally-section-label">現金</div>
    <div id="tally-cash-grid" class="tally-grid"></div>

    <!-- 回数券・定期券・無料 -->
    <div class="tally-section-label">その他</div>
    <div id="tally-other-grid" class="tally-grid tally-other"></div>

    <!-- +10円（合算端数用） -->
    <div class="tally-supplement">
      <button id="btn-supp-10" class="btn-supplement">+10円</button>
      <span id="supp-amount" class="supp-display">端数: 0円</span>
    </div>

    <!-- 操作 -->
    <div class="fare-actions">
      <button id="btn-fare-undo" class="fare-action-btn undo">取消</button>
      <button id="btn-fare-settle" class="fare-action-btn settle">計算</button>
    </div>

    <div class="fare-bottom-area">
      <button id="btn-fare-clear" class="fare-clear-btn">データクリア</button>
    </div>

    <!-- 運行タブ -->
    <div id="tab-to-driving" class="screen-tab tab-driving hidden" onclick="App.switchToDriving()">運行</div>

    <!-- 計算結果モーダル -->
    <div id="fare-settlement" class="hidden">
      <div class="settle-content">
        <h2 class="settle-title">本日の計算</h2>
        <div id="settle-body"></div>
        <button id="btn-settle-close" class="btn-large">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 運行支援画面 -->
  <div id="screen-driving" class="screen">
    <header class="header-driving">
      <span id="route-info"></span>
      <button id="btn-back" class="btn-back">← 便選択</button>
    </header>

    <div id="clock-container">
      <div id="clock"></div>
    </div>

    <div id="next-stop-container">
      <div class="next-label">▶ 次</div>
      <div id="next-stop-name"></div>
      <div id="next-stop-time"></div>
      <div id="next-stop-distance"></div>
    </div>

    <div id="upcoming-stops"></div>

    <div id="passed-section">
      <div class="section-label">── 通過済み ──</div>
      <div id="passed-stops"></div>
    </div>

    <!-- 早発アラート -->
    <div id="early-alert" class="hidden">
      <div class="alert-content">
        <p class="alert-title">早発注意！</p>
        <p id="alert-message"></p>
      </div>
    </div>

    <!-- 運行完了 -->
    <div id="trip-complete" class="hidden">
      <div class="complete-content">
        <p class="complete-title">運行完了</p>
        <p id="complete-message"></p>
        <button id="btn-complete-back" class="btn-large">便選択に戻る</button>
      </div>
    </div>

    <!-- 計算タブ（運行中のみ表示） -->
    <div id="tab-to-fare" class="screen-tab tab-fare" onclick="App.switchToFare()">計算</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>window.__supabase = supabase;</script>
  <script src="js/gtfs.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/alert.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fare-counter.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
